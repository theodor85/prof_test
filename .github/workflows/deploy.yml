# Сборка и деплой на Cloudflare Pages при пуше (в том числе мерже PR) в main.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Не запускать два деплоя одновременно; старый в очереди отменяется.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

      # wrangler-action ставит wrangler через `pnpm add`, а pnpm запрещает его build-скрипты,
      # поэтому запускаем wrangler через npx — он не трогает зависимости проекта.
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy dist --project-name=prof-test --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
